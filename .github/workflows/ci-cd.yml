name: CI / CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ──────────────────────────────────────────────
  # 1. Build & test frontend (Next.js)
  # ──────────────────────────────────────────────
  frontend:
    name: Build Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://3.93.19.170:5000/api

  # ──────────────────────────────────────────────
  # 2. Test backend (Node.js / Express)
  # ──────────────────────────────────────────────
  backend:
    name: Test Backend (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check src/server.js

      - name: Run tests
        run: npm test

  # ──────────────────────────────────────────────
  # 3. Deploy (only on push to main / master)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H 3.93.19.170 >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh ubuntu@3.93.19.170 << 'EOF'
            set -e
            cd /var/www/hrm

            echo "=== Pulling latest code ==="
            git pull origin main || git pull origin master

            echo "=== Installing backend dependencies ==="
            cd backend && npm ci --production && cd ..

            echo "=== Installing & building frontend ==="
            cd frontend && npm ci && npm run build && cd ..

            echo "=== Restarting PM2 processes ==="
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save

            echo "=== Deploy complete ==="
          EOF
